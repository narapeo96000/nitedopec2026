<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ระบบนิเทศออนไลน์ สถานศึกษาเอกชนในระบบ จ.นราธิวาส</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mut:#64748b;
  --pri:#0f766e; --pri2:#14b8a6; --bord:#e2e8f0;
  --g1:#2563eb; --y1:#0f766e; --o1:#d97706; --r1:#dc2626;
  --red:#ef4444; --grn:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Tahoma',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--bord);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--pri2)}
a{color:var(--pri)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 14px;background:#e2e8f0;color:#1e293b;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--pri);color:#fff}
.btn-add{background:#d1fae5;color:#065f46}
.btn-del{background:#fee2e2;color:#991b1b}
.btn-mini{padding:4px 10px;font-size:13px}
.btn-block{width:100%;justify-content:center;padding:12px}
.mins{background:none;border:none;color:#94a3b8;font-size:15px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;margin:0;z-index:9999;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1}
#toast.show.ok{background:#065f46}
#toast.show.err{background:#b91c1c}
/* ---------- LANDING / LOGIN & REGISTER (style เหมือน nitedtadika/nitedpondok) ---------- */
.landing{min-height:100vh;background:linear-gradient(180deg,#f4f7fa 0%,#eaf1f7 100%)}
.landing .container{padding:16px 12px calc(40px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
.landing .card{background:#fff;border:1px solid #d5e0ea;border-radius:18px;box-shadow:0 2px 12px rgba(6,95,70,.06);padding:18px;margin-bottom:16px}
.landing .card-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.landing .card-title h4{margin:0;font-size:1.1rem;font-weight:700;color:#065f46;border-left:5px solid #0f766e;padding-left:10px}
.landing .card-title .badge{background:#f0fdfa;color:#065f46;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;white-space:nowrap}
/* brand */
.landing .brand{text-align:center;margin:18px auto 6px;color:#065f46}
.landing .brand .logo{width:72px;height:72px;margin:0 auto 10px;border-radius:24px;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,118,110,.35)}
.landing .brand h1{margin:0;font-size:1.45rem;font-weight:700;line-height:1.3}
.landing .brand .sub-title{margin:6px 0 0;color:#64748b;font-size:.92rem;line-height:1.55}
.landing .brand .org-line{margin:12px 0 0;font-size:.8rem;font-weight:600;color:#065f46;line-height:1.5;word-break:break-word}
.landing .brand .org-line .org{font-weight:600}
.landing .brand .highlight{background:linear-gradient(135deg,#0f766e,#b45309);color:#fff;border-radius:14px;padding:12px 14px;margin:14px 0 6px;font-size:1.2rem;font-weight:700;line-height:1.4;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.landing .brand .highlight .hl-tag{font-size:1.15rem}
.landing .brand .highlight .hl-big{font-size:1.45rem;margin-top:2px}
.landing .brand .version-badge{display:inline-block;margin-top:10px;background:#fffbeb;color:#b45309;border:1px solid #fef3c7;border-radius:999px;padding:5px 16px;font-size:.8rem;font-weight:600}
/* form */
.landing label{display:block;font-weight:600;color:#64748b;margin:8px 0 4px;font-size:.9rem}
.landing .form-control{width:100%;min-height:46px;border-radius:12px;border:1.5px solid #d5e0ea;padding:10px 14px;font-size:1rem;font-family:inherit;color:#0f172a;background:#fff;box-sizing:border-box}
.landing .form-control:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.landing .auth-card{max-width:460px;margin:24px auto 0}
.landing .info-box{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:10px 14px;margin-top:8px}
.landing .oppts{color:#0f172a}
/* buttons */
.landing .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;font-weight:600;font-family:inherit;min-height:46px;padding:10px 18px;font-size:1rem;cursor:pointer;text-decoration:none}
.landing .btn:disabled{opacity:.55;cursor:not-allowed}
.landing .btn-primary{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.landing .w-100{width:100%}
.landing .text-center{text-align:center}
.landing .text-muted{color:#64748b}
.landing .small{font-size:.82rem}
.landing .mt-2{margin-top:8px}
.landing .mt-3{margin-top:14px}
.landing .mb-0{margin-bottom:0}
.landing .mb-3{margin-bottom:14px}
.landing .position-relative{position:relative}
.landing .checkbox-row{display:flex;gap:16px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
.landing .checkbox-row label{display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:400;font-size:.86rem;color:#475569;margin:0}
.landing .checkbox-row input{width:auto;height:auto;margin:0}
.landing .login-link{color:#0f766e;font-weight:600}
/* suggest */
.landing .suggest-box{position:absolute;z-index:1050;width:100%;max-height:300px;overflow-y:auto;border:1px solid #d5e0ea;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.14);background:#fff}
.landing .suggest-item{display:block;width:100%;text-align:left;border:none;background:#fff;border-bottom:1px solid #eef5f3;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:.95rem;color:#0f172a}
.landing .suggest-item:last-child{border-bottom:none}
.landing .suggest-item:hover,.landing .suggest-item.active{background:#f0fdfa}
.landing .suggest-item small{display:block;color:#64748b;font-size:.8rem;font-weight:400}
/* stats */
.landing .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.landing .stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}
.landing .stat-card .val{font-size:1.7rem;font-weight:700;color:#065f46}
.landing .stat-card .lbl{font-size:.8rem;color:#64748b;font-weight:600}
.landing h5{margin:14px 0 6px;font-size:.95rem;color:#065f46}
/* tables */
.landing .table-wrap{overflow-x:hidden}
.landing table{width:100%;border-collapse:collapse;font-size:.85rem}
.landing th,.landing td{padding:10px 8px;text-align:left;border-bottom:1px solid #eef5f3;vertical-align:top;word-break:break-word;overflow-wrap:anywhere}
.landing thead th{color:#b45309;background:#fef3c7;font-weight:600}
.landing .latest-table thead th{color:#1d4ed8;background:#dbeafe}
.landing .lv{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.landing .lv-green{background:#d1fae5;color:#065f46}
.landing .lv-blue{background:#dbeafe;color:#1e40af}
.landing .lv-amber{background:#fef3c7;color:#92400e}
.landing .lv-red{background:#fee2e2;color:#991b1b}
/* captcha */
.landing .captcha-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.landing .captcha-q{min-width:90px;min-height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0fdfa,#dbeafe);border:1.5px dashed #0f766e;color:#065f46;border-radius:12px;font-weight:700;font-size:1.1rem;letter-spacing:1px}
.landing .captcha-refresh{min-height:46px;min-width:52px;border-radius:12px;border:1.5px solid #d5e0ea;background:#fff;color:#065f46;font-size:1.1rem;cursor:pointer}
/* auth message */
.landing .auth-msg{border-radius:10px;padding:10px 12px;font-size:.9rem;margin:12px 0 0;display:none}
.landing .auth-msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.landing .auth-msg.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
/* footer */
.landing .app-footer{text-align:center;color:#64748b;font-size:.78rem;padding:10px 14px 22px;line-height:1.7}
.landing .app-footer .org{font-weight:600;color:#065f46}
@media (max-width:480px){
  .landing .brand .logo{width:64px;height:64px;font-size:2rem}
  .landing .brand h1{font-size:1.22rem}
  .landing .card{padding:14px;border-radius:16px;margin-bottom:12px}
  .landing .stat-card{padding:8px;border-radius:14px}
  .landing .stat-card .val{font-size:1.05rem}
  .landing .stat-card .lbl{font-size:.66rem}
  .landing .stat-grid{gap:8px}
  .landing .btn{min-height:44px;padding:8px 12px;font-size:.95rem}
  .landing .form-control{min-height:44px;padding:8px 12px;font-size:.95rem}
  .landing label{font-size:.86rem}
  .landing table{font-size:.72rem}
  .landing th,.landing td{padding:7px 4px}
  .landing .addr-table thead{display:none}
  .landing .addr-table,.landing .addr-table tbody,.landing .addr-table tr,.landing .addr-table td{display:block;width:100%}
  .landing .addr-table tbody{display:flex;flex-direction:column;gap:12px}
  .landing .addr-table tr{border:1px solid #d5e0ea;border-radius:14px;padding:10px 12px;background:#fff;box-shadow:0 2px 8px rgba(6,95,70,.05)}
  .landing .addr-table td{padding:4px 0}
  .landing .addr-table td[data-label]::before{content:attr(data-label);display:inline-block;min-width:88px;color:#64748b;font-weight:600;font-size:.68rem;vertical-align:top;margin-right:4px}
  .landing .addr-table td:first-child{border-bottom:1px dashed #d5e0ea;padding-bottom:8px;margin-bottom:6px}
  .landing .addr-table td:first-child::before{display:none}
  .landing .suggest-item{padding:12px 14px}
  .landing .app-footer{font-size:.72rem}
}
/* ---------- SHELL ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#052e2b;color:#ecfeff;padding:10px 16px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.tb-brand{font-size:15px}
.tb-user{display:flex;align-items:center;gap:8px;font-size:14px}
.tb-user .role{background:#115e59;padding:2px 8px;border-radius:20px;font-size:12px}
.main{display:flex;min-height:calc(100vh - 52px)}
.side{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--bord);padding:14px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
.side-card h4{font-size:14px;color:#065f46;margin-bottom:8px}
.side-card select{width:100%;margin-bottom:10px}
.pin-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.map{height:170px;border-radius:10px;border:1px solid var(--bord);z-index:1}
.pin-coords{display:flex;gap:6px;margin-top:8px}
.pin-coords input{flex:1;font-size:12px}
.side-actions{margin-top:10px}
.side-actions .btn{width:100%;justify-content:center}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.tb-nav{text-align:left;background:none;border:none;border-radius:8px;padding:9px 12px;font-size:14px;color:#334155}
.tb-nav:hover{background:#f0fdfa}
.tb-nav.active{background:var(--pri);color:#fff}
.nav-sep{border-top:1px solid var(--bord);margin:6px 0}
.content{flex:1;padding:16px 20px;min-width:0}
#scoreBar{margin-bottom:10px}
.chip{display:inline-block;padding:6px 14px;border-radius:20px;color:#fff;font-size:13px;font-weight:700}
.panel{display:none;animation:fade .2s}
.panel.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel-head h2{font-size:19px;color:#064e3b;margin-bottom:6px}
.panel-head .hint{color:#475569;font-size:13px;margin-bottom:10px}
.hint b{color:#0f172a}
.empty{padding:26px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;font-size:14px}
.empty.big{font-size:16px}
.empty small{display:block;margin-top:6px;color:#94a3b8;font-size:13px}
.form-wrap{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:16px;max-width:900px}
.grp{margin-bottom:14px}
.grp-h{font-weight:700;color:#065f46;background:#f0fdfa;border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px;margin-bottom:8px}
.it{border:1px solid var(--bord);border-radius:10px;margin:8px 0;overflow:hidden}
.i-head{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#f8fafc}
.i-n{background:var(--pri);color:#fff;border-radius:6px;font-size:12px;padding:2px 7px;min-width:30px;text-align:center}
.i-h{margin-left:auto;color:#94a3b8;font-size:12px;white-space:nowrap}
.i-body{padding:10px 12px}
.sc-row{display:flex;gap:8px;flex-wrap:wrap}
.sc{border:1px solid var(--bord);background:#f1f5f9;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:15px;font-weight:700;min-width:86px;transition:.15s}
.sc small{font-size:11px;font-weight:500;color:#64748b}
.sc:hover{border-color:var(--pri2)}
.sc.sc1{}.sc.sc2{}
.sc.sc0{color:#991b1b}
.sc.scna{color:#94a3b8}
.sc.scsel{border:2px solid #0f766e;background:#ccfbf1;color:#065f46;box-shadow:0 0 0 2px #99f6e4}
.note-cont{margin-top:8px}
.note-cont .lbl{font-size:12px;color:#94a3b8;display:block;margin-bottom:3px}
textarea.note{width:100%;resize:vertical}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.keyval{display:block;background:#f8fafc;border:1px solid var(--bord);border-radius:10px;padding:8px 10px}
.kv-k{display:block;font-size:12px;color:#475569;font-weight:700;margin-bottom:3px}
.keyval input{width:100%}
.sep{border-top:1px solid var(--bord);margin:14px 0}
.sec-h{font-weight:700;color:#334155;margin:10px 0 8px;font-size:14px}
.round{display:flex;gap:12px;align-items:flex-start;background:#f8fafc;border:1px solid var(--bord);border-radius:10px;padding:10px;cursor:pointer}
.round b{display:block;font-size:14px;color:#0f172a}
.round small{color:#64748b;font-weight:400}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-bottom:10px}
.supchk{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--bord);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
.supchk:hover{border-color:var(--pri2)}
.strength-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.strength-row input{flex:1}
.agree-tb{width:100%;border-collapse:collapse;margin-top:6px}
.agree-tb th,.agree-tb td{border:1px solid var(--bord);padding:6px;font-size:13px;text-align:left}
.agree-tb th{background:#f0fdfa;color:#065f46}
.agree-tb input{width:100%;border:1px solid transparent;background:transparent;padding:4px}
.agree-tb input:focus{background:#fff;border:1px solid var(--bord);outline:none}
.toolbar{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.status-row{display:flex;gap:14px;flex-wrap:wrap}
.rstatus{display:flex;gap:6px;align-items:center;font-size:14px}
.q{margin:10px 0}
.q b{display:block;margin-bottom:4px}
.q textarea{width:100%}
/* ---------- HIST / STATS ---------- */
.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.file-row{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--bord);border-radius:10px;padding:8px 12px}
.file-ic{font-size:22px}
.file-info{flex:1;min-width:0}
.file-info b{display:block;font-size:14px;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-info small{color:#64748b;font-size:12px}
.file-act{display:flex;gap:8px}
.upload-row input[type=file]{flex:1;min-width:180px}
.hist-list{display:flex;flex-direction:column;gap:10px;max-width:900px}
.hist-card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 14px}
.hist-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#334155}
.hist-scores{font-size:14px;font-weight:700;color:#0f766e;margin:6px 0}
.hist-notes div{font-size:13px;color:#475569;margin:3px 0}
.hist-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;max-width:900px}
.stat-card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;text-align:center}
.stat-card b{display:block;font-size:28px;color:#0f766e}
.stat-card span{color:#64748b;font-size:13px}
.tb{width:100%;border-collapse:collapse;max-width:900px;background:#fff;border-radius:10px;overflow:hidden}
.tb th,.tb td{border:1px solid var(--bord);padding:8px;font-size:13px;text-align:left}
.tb th{background:#0f766e;color:#fff}
.stt{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px}
.stt.ใช้งาน{background:#dcfce7;color:#166534}
.stt.รออนุมัติ{background:#fef9c3;color:#854d0e}
.stt.ระงับ{background:#fee2e2;color:#991b1b}
.help-card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:18px;max-width:860px}
.help-card h3{color:#064e3b;margin-bottom:8px}
.help-card ol{margin-left:20px}
.help-card li{margin:5px 0}
.help-card p{margin:8px 0;color:#334155}
.loading{padding:30px;text-align:center;color:#94a3b8}
.meta-box{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.meta-row{display:flex;gap:24px;flex-wrap:wrap}
.satellite-layer{z-index:0;opacity:.85}
/* --- Dashboard --- */
.dash-hero{background:linear-gradient(135deg,#052e2b 0%,#0f766e 60%,#0ea5e9 100%);border-radius:16px;padding:28px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.dash-hero-text h1{font-size:24px;color:#fff;margin-bottom:4px}
.dash-hero-text p{color:#ccfbf1;font-size:14px}
.btn-start{background:#fff;color:#065f46;border:none;border-radius:14px;padding:18px 28px;cursor:pointer;text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:.2s;min-width:220px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.btn-start:active{transform:translateY(1px)}
.btn-start-icon{font-size:28px;display:block;margin-bottom:4px}
.btn-start-text{font-size:18px;font-weight:700;display:block;color:#065f46}
.btn-start-sub{font-size:12px;color:#64748b;display:block;margin-top:2px}
.dash-draft{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.dash-draft:hover{background:#fde68a}
.dash-draft span:first-child{font-size:24px}
.dash-draft div{flex:1}
.dash-draft b{display:block;font-size:14px;color:#92400e}
.dash-draft small{color:#a16207;font-size:12px}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.dash-stat-card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.15s}
.dash-stat-card:hover{border-color:var(--pri2);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.dash-stat-icon{font-size:28px;margin-bottom:4px}
.dash-stat-num{font-size:26px;font-weight:700;color:var(--pri)}
.dash-stat-label{font-size:12px;color:#64748b;margin-top:2px}
.dash-section{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;margin-bottom:16px}
.dash-section h3{font-size:16px;color:#064e3b;margin-bottom:12px}
.dash-levels{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.dash-level-item{display:flex;align-items:center;gap:6px;font-size:13px}
.dl-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dash-avg{font-size:13px;color:#475569}
.dash-recent{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bord)}
.dash-recent:last-child{border-bottom:none}
.dash-recent-info b{display:block;font-size:14px;color:#0f172a}
.dash-recent-info small{color:#64748b;font-size:12px}
.dash-school-list{display:flex;flex-direction:column;gap:8px}
.dash-school-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f8fafc;border:1px solid var(--bord);border-radius:10px;cursor:pointer;transition:.15s}
.dash-school-item:hover{border-color:var(--pri2);background:#f0fdfa}
.dash-school-info b{display:block;font-size:14px;color:#0f172a}
.dash-school-info small{color:#64748b;font-size:12px}
.dash-more{text-align:center;padding:8px;color:#64748b;font-size:13px}
.school-pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.school-pick-card{background:#fff;border:2px solid var(--bord);border-radius:14px;padding:18px;cursor:pointer;transition:.2s;text-align:center}
.school-pick-card:hover{border-color:var(--pri);box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.school-pick-icon{font-size:36px;margin-bottom:6px}
.school-pick-name{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:4px}
.school-pick-dist{font-size:12px;color:#64748b;margin-bottom:2px}
.school-pick-form{font-size:11px;color:#0f766e;background:#ccfbf1;display:inline-block;padding:2px 8px;border-radius:10px}
@media (max-width:760px){
  .main{flex-direction:column}
  .side{width:100%;flex:none;max-height:none;position:static;border-right:none;border-bottom:1px solid var(--bord)}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:10px}
  .tb-nav{font-size:13px;padding:7px 10px}
  .nav-sep{display:none}
  .content{padding:12px}
  .hide-m{display:none}
}
/* --- Hamburger menu สำหรับมือถือ --- */
.hamburger{display:none;background:none;border:none;font-size:28px;color:#ecfeff;cursor:pointer;padding:4px 8px}
@media (max-width:760px){
  .hamburger{display:block}
  .side{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;z-index:100;overflow-y:auto;border-radius:0;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .side.open{display:block}
  .side-close{display:flex;justify-content:flex-end;padding:8px 12px}
  .side-close button{background:#fee2e2;color:#991b1b;border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer}
}
/* --- Print / PDF export --- */
@media print{
  .topbar,.side,#toast,.hamburger,.side-close{display:none!important}
  .main{display:block!important}
  .content{padding:0!important}
  .panel{display:block!important}
  .panel-head h2{font-size:16px}
  .chip{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .sc.scsel{print-color-adjust:exact;-webkit-print-color-adjust:exact;border:2px solid #0f766e;background:#ccfbf1}
  .grp-h{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .hist-card,.form-wrap{border:1px solid #ccc;page-break-inside:avoid}
  .btn,.toolbar{display:none!important}
}
/* --- Dark mode สำหรับกลางแจ้ง --- */
@media (prefers-color-scheme:dark){
  :root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--pri:#14b8a6;--pri2:#2dd4bf;--bord:#334155}
  body{background:#0f172a;color:#e2e8f0}
  input,select,textarea{background:#1e293b;color:#e2e8f0;border-color:#475569}
  .topbar{background:#020617}
  .side{background:#1e293b;border-color:#334155}
  .tb-nav{color:#e2e8f0}
  .tb-nav:hover{background:#334155}
  .card,.form-wrap,.hist-card,.stat-card,.help-card{background:#1e293b;border-color:#334155;color:#e2e8f0}
  .grp-h{background:#0f172a;color:#5eead4}
  .it{border-color:#334155}
  .i-head{background:#1e293b}
  .sc{background:#1e293b;border-color:#475569;color:#e2e8f0}
  .sc.scsel{background:#134e4a;border-color:#14b8a6;color:#5eead4}
  .empty{background:#1e293b;border-color:#475569;color:#94a3b8}
  .landing{background:linear-gradient(180deg,#0f172a 0%,#0d1520 100%)}
  .landing .card,.landing .stat-card{background:#1e293b;border-color:#334155}
  .landing .card-title h4,.landing .brand,.landing .brand .org-line,.landing h5{color:#5eead4}
  .landing .card-title .badge{background:#134e4a;color:#5eead4}
  .landing .brand .logo{background:linear-gradient(135deg,#134e4a,#115e59)}
  .landing .brand .highlight{background:linear-gradient(135deg,#134e4a,#92400e)}
  .landing label{color:#94a3b8}
  .landing .form-control{background:#0f172a;color:#e2e8f0;border-color:#475569}
  .landing .suggest-box{background:#1e293b;border-color:#334155}
  .landing .suggest-item{background:#1e293b;color:#e2e8f0;border-color:#334155}
  .landing .suggest-item:hover,.landing .suggest-item.active{background:#134e4a}
  .landing .oppts{color:#e2e8f0}
  .landing th,.landing td{border-color:#334155}
  .landing thead th{background:#453a20;color:#fcd34d}
  .landing .latest-table thead th{background:#1e3a5f;color:#93c5fd}
  .landing .stat-card .val{color:#5eead4}
  .meta-box{background:#0f172a;border-color:#134e4a}
  .agree-tb th{background:#134e4a;color:#5eead4}
  .tb th{background:#134e4a;color:#5eead4}
  .score-bar,.stat-card b{color:#5eead4}
  .dash-hero{background:linear-gradient(135deg,#020617 0%,#134e4a 60%,#0c4a6e 100%)}
  .btn-start{background:#1e293b;color:#5eead4}
  .btn-start-text{color:#5eead4}
  .dash-stat-card,.dash-section,.school-pick-card{background:#1e293b;border-color:#334155;color:#e2e8f0}
  .dash-stat-card:hover,.school-pick-card:hover{border-color:#14b8a6}
  .dash-school-item{background:#1e293b;border-color:#334155}
  .dash-school-item:hover{background:#0f172a;border-color:#14b8a6}
  .dash-recent{border-color:#334155}
  .dash-recent-info b{color:#e2e8f0}
  .school-pick-card{background:#1e293b;border-color:#334155}
  .school-pick-name{color:#e2e8f0}
}
</style>
